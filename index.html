<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Janmashtami 🦚💙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: #fff;
  text-align: center;
  background:
    radial-gradient(circle at 50% 20%, #315b91 0%, #172b52 35%, #080f24 100%);
  overflow-x: hidden;
}

.container {
  min-height: 100vh;
  padding: 35px 20px 45px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.feather {
  font-size: 70px;
  animation: float 3s ease-in-out infinite;
}

h1 {
  margin: 10px 0;
  font-size: clamp(34px, 10vw, 58px);
  color: #ffe08a;
  text-shadow: 0 0 18px rgba(255, 224, 138, 0.6);
}

.subtitle {
  font-size: 20px;
  color: #d8eaff;
  margin-bottom: 25px;
}

.card {
  width: min(92%, 500px);
  padding: 30px 22px;
  border-radius: 28px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 15px 45px rgba(0,0,0,0.35);
  backdrop-filter: blur(10px);
}

.card h2 {
  color: #ffe08a;
  margin-top: 0;
}

.quote {
  font-size: 21px;
  line-height: 1.7;
  color: #fff;
}

.radhe {
  margin-top: 25px;
  font-size: 28px;
  color: #8ed8ff;
}

.footer {
  margin-top: 30px;
  font-size: 16px;
  color: #c9d8ef;
}

.diya {
  font-size: 34px;
  margin: 20px 0;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-12px);
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="feather">🦚</div>

  <h1>Happy Janmashtami</h1>

  <div class="subtitle">
    💙 Jai Shri Krishna 💙
  </div>

  <div class="card">
    <h2>🌸 Krishna Blessings 🌸</h2>

    <p class="quote">
      “May Lord Krishna fill your life with
      peace, happiness, love and endless blessings.”
    </p>

    <div class="radhe">
      🪷 Radhe Radhe 🪷
    </div>
  </div>

  <div class="diya">🪔 ✨ 🪔</div>

  <div class="footer">
    May Krishna's flute bring music to your life
    and His blessings light your path. 💙
  </div>

</div>

</body>
</html>
