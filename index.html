<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Janmashtami 🦚💙</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  color: #fff;
  text-align: center;
  background:
    radial-gradient(circle at 50% 20%, #315b91 0%, #172b52 35%, #080f24 100%);
  overflow-x: hidden;
}

.container {
  min-height: 100vh;
  padding: 35px 20px 45px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.feather {
  font-size: 70px;
  animation: float 3s ease-in-out infinite;
}

h1 {
  margin: 10px 0;
  font-size: clamp(34px, 10vw, 58px);
  color: #ffe08a;
  text-shadow: 0 0 18px rgba(255, 224, 138, 0.6);
}

.subtitle {
  font-size: 20px;
  color: #d8eaff;
  margin-bottom: 25px;
}

.card {
  width: min(92%, 500px);
  padding: 30px 22px;
  border-radius: 28px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.25);
  box-shadow: 0 15px 45px rgba(0,0,0,0.35);
  backdrop-filter: blur(10px);
}

.card h2 {
  color: #ffe08a;
  margin-top: 0;
}

.quote {
  font-size: 21px;
  line-height: 1.7;
  color: #fff;
}

.radhe {
  margin-top: 25px;
  font-size: 28px;
  color: #8ed8ff;
}

.footer {
  margin-top: 30px;
  font-size: 16px;
  color: #c9d8ef;
}

.diya {
  font-size: 34px;
  margin: 20px 0;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-12px);
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="feather">🦚</div>

  <h1>Happy Janmashtami</h1>

  <div class="subtitle">
    💙 Jai Shri Krishna 💙
  </div>

  <div class="card">
    <h2>🌸 Krishna Blessings 🌸</h2>

    <p class="quote">
      “May Lord Krishna fill your life with
      peace, happiness, love and endless blessings.”
    </p>

    <div class="radhe">
      🪷 Radhe Radhe 🪷
    </div>
  </div>

  <div class="diya">🪔 ✨ 🪔</div>

  <div class="footer">
    May Krishna's flute bring music to your life
    and His blessings light your path. 💙
  </div>

</div>

</body> <div style="text-align:center; margin:25px 10px;">

<button id="fluteBtn"
style="padding:14px 22px; border:0; border-radius:30px; font-size:16px; font-weight:bold;">
🎵 Play Krishna Flute
</button>

<br>

<button id="blessingBtn"
style="padding:14px 22px; border:0; border-radius:30px; font-size:16px; font-weight:bold;">
💙 Tap for More Krishna Blessings
</button>

</div>

<audio id="fluteAudio" loop>
<source src="audio/flute.mp3" type="audio/mpeg">
</audio>

<div id="blessingPopup"></div>

<script>

const flute = document.getElementById("fluteAudio");
const fluteBtn = document.getElementById("fluteBtn");
const blessingBtn = document.getElementById("blessingBtn");
const popup = document.getElementById("blessingPopup");

flute.volume = 0.30;

fluteBtn.onclick = function() {

  if (flute.paused) {
    flute.play();
    fluteBtn.innerHTML = "🔇 Stop Krishna Flute";
  } else {
    flute.pause();
    fluteBtn.innerHTML = "🎵 Play Krishna Flute";
  }

};

const blessings = [
"May Krishna fill your life with happiness and peace. 💙",

"May Shri Krishna always guide you towards the right path. 🦚",

"May your heart always be filled with love and joy. 🌸",

"May Krishna bless you and your family with endless happiness. 🪔",

"May every difficulty in your life turn into a new blessing. ✨",

"May Krishna's divine flute bring peace to your heart. 🎵"
];

let number = 0;

blessingBtn.onclick = function() {

popup.innerHTML = `
<div style="
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:80%;
max-width:350px;
padding:25px;
text-align:center;
border-radius:25px;
background:#172f55;
color:white;
box-shadow:0 0 40px rgba(255,215,100,.6);
z-index:9999;
">

<div style="font-size:45px;">🦚✨</div>

<h2 style="color:#ffd76b;">
Krishna's Blessing
</h2>

<p style="font-size:18px;line-height:1.6;">
${blessings[number]}
</p>

<div style="font-size:25px;">
🌸 Radhe Radhe 🌸
</div>

</div>
`;

number++;

if(number >= blessings.length) {
number = 0;
}

setTimeout(function() {
popup.innerHTML = "";
},4000);

};

</script>
</html>
